<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>计算机免修考试 · 刷题</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --fg:#1f2430; --muted:#6b7280; --line:#e6e8ec;
  --pri:#2563eb; --pri-soft:#eaf0ff; --ok:#16a34a; --ok-soft:#e9f8ee;
  --bad:#dc2626; --bad-soft:#fdecec; --warn:#d97706; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 108px}
a{color:var(--pri)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .inner{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 14px}
.tb-back{font-size:22px;line-height:1;padding:2px 6px;border-radius:8px;color:var(--pri)}
.tb-title{font-weight:700;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--warn)}
.clock.danger{color:var(--bad)}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:18px 4px 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pbar{height:7px;border-radius:99px;background:#e9edf3;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);border-radius:99px;transition:width .25s}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.row+.row{border-top:1px dashed var(--line)}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:13px;margin:12px 0}

/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6 55%,#22c55e);color:#fff;border-radius:18px;padding:18px 16px;margin:14px 0 4px;box-shadow:0 6px 20px rgba(37,99,235,.25)}
.hero h1{margin:0 0 4px;font-size:19px;line-height:1.35}
.hero p{margin:0 0 12px;font-size:13px;opacity:.92}
.hero .pbar{background:rgba(255,255,255,.28)}
.hero .pbar>i{background:#fff}
.hero .nums{display:flex;gap:16px;margin-top:10px;font-size:12px;opacity:.95}
.hero .nums b{font-size:17px;display:block;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px;text-align:left;display:block;width:100%;box-shadow:0 1px 2px rgba(20,30,60,.04);transition:transform .08s}
.mode:active{transform:scale(.985)}
.mode b{display:block;font-size:15.5px;margin-bottom:3px}
.mode span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.mode .pill{display:inline-block;background:var(--pri-soft);color:var(--pri);font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.mode.hl{background:linear-gradient(135deg,#eff6ff,#fff);border-color:#bfdbfe}

/* ---------- quiz ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--pri);background:var(--pri-soft);border-radius:99px;padding:2px 9px;margin-bottom:9px}
.tag.gray{color:var(--muted);background:#f1f3f7}
.stem{font-size:17.5px;font-weight:600;line-height:1.62;margin-bottom:14px;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:#fbfcfe;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;line-height:1.55;transition:background .12s,border-color .12s}
.opt:active{background:#f2f5fa}
.opt .k{flex:0 0 24px;height:24px;border-radius:50%;background:#eef1f6;color:#475569;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt .t{flex:1;word-break:break-word}
.opt.ok{background:var(--ok-soft);border-color:#86efac}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-soft);border-color:#fca5a5}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt.picked{border-color:var(--pri);background:var(--pri-soft)}
.opt.picked .k{background:var(--pri);color:#fff}
.ansline{margin-top:12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ansline .good{color:var(--ok)}
.ansline .wrong{color:var(--bad)}
.navbtns{display:flex;gap:10px;margin:14px 0}
.navbtns button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.navbtns button.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.navbtns button.fav{flex:0 0 64px}
.navbtns button:disabled{opacity:.45}
.navbtns button:active{transform:scale(.985)}

/* ---------- exam ---------- */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px;margin-top:8px}
.sheet button{border:1px solid var(--line);border-radius:9px;padding:8px 0;font-size:13px;font-weight:600;background:#fff;font-variant-numeric:tabular-nums}
.sheet button.done{background:var(--pri-soft);border-color:#bfdbfe;color:var(--pri)}
.sheet button.cur{background:var(--pri);border-color:var(--pri);color:#fff}
.sheet button.ok{background:var(--ok-soft);border-color:#86efac;color:#166534}
.sheet button.bad{background:var(--bad-soft);border-color:#fca5a5;color:#991b1b}

/* ---------- stats ---------- */
.bar{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 0}
.bar .name{flex:0 0 88px;color:#334155;font-weight:600}
.bar .track{flex:1;height:9px;border-radius:99px;background:#eef1f6;overflow:hidden}
.bar .track>i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar .track>i.low{background:var(--bad)}
.bar .track>i.mid{background:var(--warn)}
.bar .val{flex:0 0 96px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.kpi div{background:#f8fafc;border-radius:12px;padding:9px 4px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}
table.hist{width:100%;border-collapse:collapse;font-size:13.5px}
table.hist th,table.hist td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.hist th:first-child,table.hist td:first-child{text-align:left;font-variant-numeric:normal}

/* ---------- ops ---------- */
.ops h3{font-size:15.5px;margin:16px 0 6px;color:#0f172a;border-left:4px solid var(--pri);padding-left:9px}
.ops ol{margin:0;padding-left:22px}
.ops li{margin:7px 0;line-height:1.65;font-size:14.5px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12.5px;background:#f8fafc;font-family:ui-monospace,Consolas,monospace}

/* ---------- bottom nav ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{max-width:780px;margin:0 auto;display:flex}
.tabbar button{flex:1;padding:8px 0 9px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ic{font-size:18px;line-height:1.1}
.tabbar button.on{color:var(--pri);font-weight:700}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);background:rgba(17,24,39,.92);color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14.5px}
</style>
</head>
<body>
<div class="topbar" id="topbar" style="display:none"></div>
<div class="wrap" id="app"></div>
<nav class="tabbar"><div class="inner" id="tabs"></div></nav>
<div id="toast"></div>
<script>
"use strict";
/* ==================== 数据 ==================== */
var QUESTIONS = [{"no":1,"lesson":"第1课","stem":"AI（人工智能）的通俗定义是","options":["能模拟人类完成特定任务的计算机程序","能产生自我意识并理解情感的机器人","所有能联网运行的软件程序的统称","人类编写的一切代码和脚本的集合"],"answer":"A"},{"no":2,"lesson":"第1课","stem":"按照讲义，当前所有AI产品都属于","options":["强AI","弱AI","通用人工智能","超人工智能"],"answer":"B"},{"no":3,"lesson":"第1课","stem":"弱AI（专用人工智能）的特点是","options":["能在多个领域之间迁移学习并自主推理","在几乎所有任务上都达到人类智能水平","只能完成特定领域任务","目前仅存在于实验室的理论设想之中"],"answer":"C"},{"no":4,"lesson":"第1课","stem":"关于强AI（通用人工智能），下列说法正确的是","options":["目前已经实现并广泛使用","存在于大多数日常产品中","Siri就属于强AI","目前尚不存在，是未来的发展方向"],"answer":"D"},{"no":5,"lesson":"第1课","stem":"AI与传统软件的核心区别是","options":["传统软件靠人写死规则，AI从数据中自己学习规律","传统软件从数据中自学，AI靠人写死规则","两者在原理与实现上完全没有区别","传统软件会自主学习，AI则不会学习"],"answer":"A"},{"no":6,"lesson":"第1课","stem":"讲义把传统软件比作“照着菜谱做菜”，那么AI更像","options":["一本记录详细步骤和配料的菜谱","看过大量菜品后自己琢磨出做菜规律","一台只能做加减乘除的普通计算器","一部预先录制好的教学视频"],"answer":"B"},{"no":7,"lesson":"第1课","stem":"Siri属于弱AI，最根本的原因是","options":["它能力全面，能应对各类复杂问题","它能跨领域学习并自主创造内容","它只能做特定任务，难以灵活应对所有问题","它属于通用人工智能而非弱AI"],"answer":"C"},{"no":8,"lesson":"第1课","stem":"AI概念诞生、图灵测试提出的时期是","options":["突破期（1997-2012）","普及期（2012-2022）","智能体时代（2024-2026）","起步期（1950s-1970s）"],"answer":"D"},{"no":9,"lesson":"第1课","stem":"1997年战胜国际象棋世界冠军的是","options":["深蓝（Deep Blue），IBM开发的国际象棋程序","ChatGPT，一款能进行多轮对话的大语言模型","AlphaGo，战胜围棋世界冠军的智能程序","Siri，苹果公司推出的智能语音助手"],"answer":"A"},{"no":10,"lesson":"第1课","stem":"深度学习在图像识别大赛取得突破、AI进入快速发展期的年份是","options":["1997年","2012年","2022年","2024年"],"answer":"B"},{"no":11,"lesson":"第1课","stem":"生成式AI爆发（2022至今）的标志性事件是","options":["深蓝战胜国际象棋冠军","图灵测试提出","ChatGPT引发大模型热潮","AI Agent全面普及"],"answer":"C"},{"no":12,"lesson":"第1课","stem":"AI从“问答工具”升级为“能自主完成复杂任务的智能助手”，对应哪个阶段","options":["人工智能整体处于起步探索的初步发展阶段","人工智能整体处于低谷回落的发展困难阶段","人工智能整体正处于技术大范围普及推广应用的阶段","人工智能进入智能体时代（2024—2026年）"],"answer":"D"},{"no":13,"lesson":"第1课","stem":"用“诺基亚语音拨号→iPhone的Siri→抖音推荐→ChatGPT→AI Agent”串联时间线，最能直观感受的是","options":["AI能力的持续跃迁","手机屏幕的不断变大","电池技术的逐步进步","网络速度的持续提升"],"answer":"A"},{"no":14,"lesson":"第1课","stem":"第一代信息获取方式（传统搜索引擎）的工作原理是","options":["自然语言提问后直接给出整合答案","关键词匹配返回链接列表，由用户自行阅读整合","给出目标后由Agent自动完成任务","通过语音输入直接给出结论"],"answer":"B"},{"no":15,"lesson":"第1课","stem":"第二代AI搜索（如秘塔搜索、Perplexity）的特点是","options":["只返回一长串网页链接的列表让用户自己筛选","给出的答案完全正确但不附带任何来源","直接给答案并附可追溯来源，节省整合时间","输出的结果完全正确且不需要人工核验"],"answer":"C"},{"no":16,"lesson":"第1课","stem":"第三代AI Agent（智能体）获取信息的特点是","options":["只能返回搜索引擎所给出的链接列表","只能针对用户提问直接给出一个单一答案","第三代获取信息的过程完全不涉及任何自动化操作处理","给出目标后自主拆解任务多步调用工具返回完整成果"],"answer":"D"},{"no":17,"lesson":"第1课","stem":"三代信息获取方式的交互方式演变顺序是","options":["关键词→自然语言→目标指令","自然语言→关键词→目标指令","目标指令→关键词→自然语言","三代一直使用关键词"],"answer":"A"},{"no":18,"lesson":"第1课","stem":"三代信息获取方式的自动化程度演变顺序是","options":["AI自主执行→人工筛选→AI整合","人工筛选→AI整合→AI自主执行","三代完全相同","三代都由人工完成"],"answer":"B"},{"no":19,"lesson":"第1课","stem":"三代信息获取方式的可信度特点，表述正确的是","options":["三代信息获取之后都不需要再进行人工的核验","三代获取到的信息都没有来源可供用户追溯查询","第一代来源明确，第二代附引用，第三代需审核","第二代获取信息时其来源最不明确、可靠性也最差"],"answer":"C"},{"no":20,"lesson":"第1课","stem":"写论文需要查找某个领域的研究现状，最合适的做法是","options":["只相信AI生成的答案，不做核验","只用传统搜索，且不做核验","随意选择一种方式，且不做核验","按场景选最优方式，并人工核验AI输出"],"answer":"D"},{"no":21,"lesson":"第1课","stem":"“刷脸支付、手机人脸解锁、门禁人脸识别”属于哪一类AI场景","options":["身份识别类","内容推荐类","图像创作类","语音交互类"],"answer":"A"},{"no":22,"lesson":"第1课","stem":"“抖音/快手/小红书的视频推荐、淘宝/京东的商品推荐”的核心是","options":["你是谁","猜你喜欢","听懂和说出","生成图片"],"answer":"B"},{"no":23,"lesson":"第1课","stem":"“外卖/打车的路径规划与ETA预测、输入法的智能联想与纠错”属于哪一类AI场景","options":["身份识别类，如人脸识别和指纹验证","图像创作类，如生成图片和海报","生活服务类，路径规划与智能联想辅助决策","学习办公类，如文档写作和翻译"],"answer":"C"},{"no":24,"lesson":"第1课","stem":"点外卖时显示“预计30分钟送达”，背后AI主要在做","options":["识别你的身份信息","生成商品展示图片","播放背景音乐","优化配送路径并预测送达时间"],"answer":"D"},{"no":25,"lesson":"第1课","stem":"第一代传统搜索引擎的典型代表工具是","options":["秘塔搜索、Perplexity","豆包智能体、扣子Coze","即梦、可灵","百度、Bing"],"answer":"D"},{"no":26,"lesson":"第2课","stem":"传统编程范式的核心是","options":["人把所有规则想清楚，计算机只是执行","机器从大量数据中自己学习规律","人只提供例子，计算机自己找规律","规则是隐性的、由机器学出来的"],"answer":"A"},{"no":27,"lesson":"第2课","stem":"机器学习范式的核心是","options":["人编写显性的规则代码交给计算机执行","人提供大量数据，计算机自己学习规律生成模型","计算机只按人写好的规则来计算执行","整个过程完全不需要任何数据来参与"],"answer":"B"},{"no":28,"lesson":"第2课","stem":"传统编程与机器学习中“规则”的区别是","options":["两者的规则都来自机器本身的学习","两者的规则都来自人工的编写","前者规则由人显性写，后者由机器隐性学","两者本质上没有任何规则存在"],"answer":"C"},{"no":29,"lesson":"第2课","stem":"下列情况更适合使用机器学习的是","options":["规则简单明确，如计算圆的面积","任何情况下都不需要机器学习","规则固定且长期不会变化","规则复杂难写或随时间变化，如用户偏好"],"answer":"D"},{"no":30,"lesson":"第2课","stem":"判断“什么样的图片是猫”这类任务更适合用","options":["机器学习，规则复杂人写不出","传统编程，更准确高效","两者都不适合，只能靠人","只能依靠人工逐个判断"],"answer":"A"},{"no":31,"lesson":"第2课","stem":"判断“邮件是否为垃圾邮件”更适合使用","options":["传统编程，垃圾邮件的规则可以完全写死","机器学习，规则复杂且会随时间变化","两者都不需要，只能靠人工逐个判断","只能依靠人工来判断处理每一封邮件"],"answer":"B"},{"no":32,"lesson":"第2课","stem":"“计算圆的面积”这类任务更适合","options":["机器学习，靠数据学规律","必须使用机器学习","传统编程，规则简单更准确高效","无法完成这类任务"],"answer":"C"},{"no":33,"lesson":"第2课","stem":"监督学习的特点是","options":["给机器的训练数据完全不带标签","机器靠试错和奖励信号来学习","机器自己发现数据中的结构和规律","给带标签数据学习输入输出映射，应用最广"],"answer":"D"},{"no":34,"lesson":"第2课","stem":"无监督学习的特点是","options":["给无标签数据，机器自己发现结构和规律","给带标签的数据做对照监督学习","通过试错和奖励来逐步获得能力","只用于下棋一类的游戏任务"],"answer":"A"},{"no":35,"lesson":"第2课","stem":"强化学习的学习方式是","options":["对照标准答案来进行监督学习","通过试错和奖励来学，做对奖励做错惩罚","把相似的数据聚成一类处理","不需要任何反馈信号即可学习"],"answer":"B"},{"no":36,"lesson":"第2课","stem":"AlphaGo（游戏AI）用到的学习方式是","options":["监督学习","无监督学习","强化学习","传统编程"],"answer":"C"},{"no":37,"lesson":"第2课","stem":"人脸识别属于哪类学习方式","options":["无监督学习，靠数据聚类来分组","强化学习，靠试错获得奖励信号","传统编程，靠人工编写固定规则","监督学习，每张训练人脸都有姓名标签"],"answer":"D"},{"no":38,"lesson":"第2课","stem":"数据集通常分为三部分，其中占比最大（约70%）的是","options":["训练集","验证集","测试集","校准集"],"answer":"A"},{"no":39,"lesson":"第2课","stem":"用来在训练过程中调整参数、防止过拟合的是","options":["训练集，用来训练模型的参数","验证集，训练中调参并防止过拟合","测试集，用来评估最终表现","以上都不需要，直接部署使用"],"answer":"B"},{"no":40,"lesson":"第2课","stem":"用来最终评估模型效果、训练时不接触的是","options":["训练集","验证集","测试集（约15%）","全部数据集"],"answer":"C"},{"no":41,"lesson":"第2课","stem":"准确率（Accuracy）指的是","options":["训练数据的数量","模型的参数规模","训练的时长","模型预测正确的比例"],"answer":"D"},{"no":42,"lesson":"第2课","stem":"“垃圾进，垃圾出”（Garbage In, Garbage Out）说明的是","options":["训练数据质量差或有偏差，模型效果就差","垃圾数据越多，模型效果反而越好","数据量大小对模型效果无关紧要","只要算法好，数据好坏无所谓"],"answer":"A"},{"no":43,"lesson":"第2课","stem":"把训练AI比作培养学生，那么“模拟考试”（用来查漏补缺）对应的是","options":["训练集","验证集","测试集","课本和练习题"],"answer":"B"},{"no":44,"lesson":"第2课","stem":"把训练AI比作培养学生，“期末考试”（用来检验真实水平）对应的是","options":["训练集","验证集","测试集","课本和练习题"],"answer":"C"},{"no":45,"lesson":"第2课","stem":"如果训练集里全是白猫的图片，测试时给一张黑猫，模型最可能的结果是","options":["完美识别出这是一只可爱的猫并给出正确结果","识别结果完全不会受到任何影响","一定能正确地把黑猫识别出来并输出结果","只学到白色等于猫而非真猫特征，出现偏差"],"answer":"D"},{"no":46,"lesson":"第2课","stem":"欠拟合（Underfitting）的表现是","options":["模型太简单，训练集和测试集准确率都低","训练集准确率很高，测试集准确率低","只在全新的数据上表现好","模型的复杂度太高"],"answer":"A"},{"no":47,"lesson":"第2课","stem":"过拟合（Overfitting）的表现是","options":["训练集和测试集准确率都低","训练集准确率很高，新数据上表现差","训练测试都很高且泛化良好","模型的复杂度太低"],"answer":"B"},{"no":48,"lesson":"第2课","stem":"防止过拟合的方法包括","options":["减少训练数据的数量规模来简化任务","让模型的复杂度变得更高、参数更多","增加数据、简化模型、数据增强、提前停止","只增加模型训练的时间长度即可"],"answer":"C"},{"no":49,"lesson":"第2课","stem":"过拟合更可能发生在","options":["训练数据很多的时候","任何情况下都不会发生","与数据量完全无关","数据少时易记住特例而非规律"],"answer":"D"},{"no":50,"lesson":"第2课","stem":"关于零代码平台的监督学习应用，下列说法正确的是","options":["只能做图像分类这一件事而已","训练好的模型无法导出使用","还可做目标检测、文本分类、语音识别等","不需要任何数据就能训练"],"answer":"C"},{"no":51,"lesson":"第3课","stem":"一张RGB彩色图片中，每个像素由几个数字表示","options":["3个","1个","2个","4个"],"answer":"A"},{"no":52,"lesson":"第3课","stem":"一张1080p图片大约有多少个像素","options":["20万","约200万","2000万","2万"],"answer":"B"},{"no":53,"lesson":"第3课","stem":"AI识别图像的底层（第一层）识别的是","options":["整体的语义含义","眼睛、耳朵等局部形状","边缘、线条、颜色块","图片中的文字"],"answer":"C"},{"no":54,"lesson":"第3课","stem":"AI识别图像的高层（最后一层）做的是","options":["识别颜色块和基础色带","识别纹理细节和图案","识别边缘和线条走向","组合局部特征判断整体是什么"],"answer":"D"},{"no":55,"lesson":"第3课","stem":"AI的“看”与人的“看”的本质区别是","options":["人基于理解语义，AI基于模式匹配与概率","两者的识别方式完全相同","AI能够真正理解猫是什么动物","人靠模式匹配和概率统计来识别"],"answer":"A"},{"no":56,"lesson":"第3课","stem":"图像分类（Image Classification）任务是","options":["找到图中物体的位置","判断整张图片类别并输出标签","做像素级边界划分","对图片进行修复增强"],"answer":"B"},{"no":57,"lesson":"第3课","stem":"目标检测（Object Detection）任务的特点是","o },{"no":182,"lesson":"第8课","stem":"AI在各行业应用的共性逻辑，三个方向不包括","options":["替代重复劳动","辅助复杂决策","替代人类的独立思考","创造全新体验"],"answer":"C"},{"no":183,"lesson":"第8课","stem":"AI对就业的三种影响是","options":["岗位消失且不再产生新岗位","只有岗位替代一种","只有岗位创造一种","岗位替代、岗位变革、岗位创造"],"answer":"D"},{"no":184,"lesson":"第8课","stem":"更容易被AI替代的岗位特征是","options":["工作重复性高、规则明确，主要处理标准化信息","需要创造性与突破性思维，AI难以胜任此类工作","需要复杂人际互动与情感投入，AI难以替代","需要复杂决策与伦理判断，人类更具独特优势"],"answer":"A"},{"no":185,"lesson":"第8课","stem":"下列不属于“更难被AI替代”的岗位是","options":["心理咨询师","基础数据录入","护士","外科医生"],"answer":"B"},{"no":186,"lesson":"第8课","stem":"关键认知“不是AI替代人，而是”","options":["AI会替代掉所有的工作岗位","人完全不需要学习AI","会用AI的人替代不会用AI的人","AI会替代掉整个职业"],"answer":"C"},{"no":187,"lesson":"第8课","stem":"放射科医生的案例说明","options":["放射科医生这一整个岗位已被AI完全替代而消失殆尽","AI直接取代放射科医生，医院从此不再需要该医生","医生看片诊断与临床沟通的工作内容前后毫无改变","AI只替代岗位中重复任务，医生转为审核与临床沟通"],"answer":"D"},{"no":188,"lesson":"第8课","stem":"未来方向“具身智能与机器人”是指","options":["AI从虚拟走向物理世界，机器人在现实中感知决策行动","AI能力始终只在云端运行，完全无法接触物理世界","AI应用只局限于网页浏览器中，并不涉及任何实体设备","未来世界永远不会出现任何形式的机器人或智能硬件"],"answer":"A"},{"no":189,"lesson":"第8课","stem":"“端侧AI与AI硬件”是指","options":["AI能力始终只集中在云端服务器，终端设备无需任何算力","AI能力从云端下沉到终端，本地运行响应更快且隐私更好","手机眼镜汽车等终端设备本身完全不需要内置AI能力","AI计算只在远端服务器上运行，本地终端设备完全不参与"],"answer":"B"},{"no":190,"lesson":"第8课","stem":"开源大模型（如DeepSeek、Qwen、Llama等）的意义是","options":["开源大模型大幅提高了AI使用与企业部署的整体成本","开源大模型技术尚不成熟，实际上不具备任何实际意义","性能持续提升缩小与闭源差距，降低使用成本并促进创新","开源大模型仅供学术界做研究，无法真正落地到产业应用"],"answer":"C"},{"no":191,"lesson":"第8课","stem":"关于AI的未来发展，需要理性看待的是","options":["通用人工智能AGI已经在现实世界中完全实现并被广泛普及","AI已经具备真正的理解力、自我意识与人类情感","AI的未来发展不受任何技术算力与伦理的局限","AGI仍未实现，AI缺乏真正理解意识情感，面临多重挑战"],"answer":"D"},{"no":192,"lesson":"第8课","stem":"个人AI能力模型的两个维度是","options":["AI操作能力与AI难以替代的核心能力两个维度","只需学会使用各种AI工具，完全无需培养其他能力","只培养个人核心能力，完全不需要学习使用AI","AI时代无需学习任何能力，坐等技术自然进步"],"answer":"A"},{"no":193,"lesson":"第8课","stem":"AI操作能力在AI时代属于","options":["它是个人在AI时代极难被替代的长期核心竞争力","基础门槛，相对易学且会随工具普及而逐渐贬值","AI操作能力在实际工作中几乎毫无用处","AI操作能力只有少数技术人员才需要掌握"],"answer":"B"},{"no":194,"lesson":"第8课","stem":"核心能力（创造力、复杂沟通、批判性思维、情感共情、伦理判断等）属于","options":["这些核心能力其实都可以在很短时间内快速速成加以掌握","它们只是AI时代人人都能轻松跨过的基础门槛而已","长期竞争力，是AI难以替代的独特价值，越积累越增值","这些传统核心能力在AI时代已经变得完全过时无用"],"answer":"C"},{"no":195,"lesson":"第8课","stem":"最佳策略“复合能力模型”是指","options":["只依赖AI工具，完全不再培养其他能力","只靠个人核心能力，完全拒绝使用AI工具","放弃学习AI，只深耕传统专业技能","同时发展AI操作能力与核心能力，形成人机协作复合竞争力"],"answer":"D"},{"no":196,"lesson":"第8课","stem":"技术类专业（计算机、电子、自动化等）的侧重点是","options":["AI操作要求更高，需深入学技术并发展系统设计等核心能力","只需会用现成工具，无需理解底层原理","完全不需要学习AI相关前沿知识","只需埋头学纯理论，不接触实际应用"],"answer":"A"},{"no":197,"lesson":"第8课","stem":"商科类专业（金融、管理、营销等）的侧重点是","options":["偏重科研深度，多发表论文走纯学术路线","AI操作侧重数据分析工具，重点发展商业判断、沟通与领导力","完全不需要AI工具，仅凭个人经验即可应对","只需埋头学编程语言，无需理解业务场景"],"answer":"B"},{"no":198,"lesson":"第8课","stem":"关于学习能力，下列说法正确的是","options":["学习能力在AI时代其实无关紧要，技术会帮人搞定一切","学习能力只在学生读书时期重要，工作后不再需要","学习能力是最重要核心能力之一，须建立终身学习意识","学习能力只在刚入职工作时需要，老员工无需再学"],"answer":"C"},{"no":199,"lesson":"第8课","stem":"学生A与学生B的案例说明","options":["AI操作能力只是加分项，并非求职发展的必备项","相比之下个人核心能力并不重要，可有可无","不会使用AI也能在职业道路上正常发展晋升","AI操作能力是必备项，核心能力决定你能走多远"],"answer":"D"},{"no":200,"lesson":"第8课","stem":"本课程的结课综合大作业题目是","options":["课程结课作业完全不需要做任何调研，随便写点即可","撰写人工智能在本专业领域应用调研与创新思考报告","只需提交一篇简短的课程学习心得体会即可","课程结课不需要提交任何形式的报告或作业"],"answer":"B"},{"no":201,"lesson":"第1课","stem":"下列最能体现“AI从数据中学习规律”的例子是","options":["给机器大量标注图片，让机器自己琢磨区别","人工写出如果是猫就输出猫的规则","让机器背下所有人写的固定规则","机器只执行人写死的操作步骤"],"answer":"A"},{"no":202,"lesson":"第1课","stem":"关于AI产品的存在形式，下列说法正确的是","options":["AI只能以实体机器人的形式存在，不能是纯软件产品","更多AI以软件形式存在于手机App中，机器人只是载体","任何AI产品都必须拥有实体机器人外壳才能正常运行","AI只存在于封闭实验室当中，从未真正走入大众日常生活"],"answer":"B"},{"no":203,"lesson":"第1课","stem":"关于“AI寒冬”，下列说法正确的是","options":["AI发展历史上从未发生过所谓AI寒冬这一现象","AI寒冬指AI技术被大众彻底遗忘而长期无人问津","两次AI寒冬发生在低谷期，因技术瓶颈导致投资大幅减少","AI寒冬在人类历史上只发生过一次，且其影响范围非常小"],"answer":"C"},{"no":204,"lesson":"第1课","stem":"下列AI发展时间轴事件顺序正确的是","options":["深蓝胜棋王在2022年，深度学习突破在1997年","图灵测试概念在2022年才被正式提出","AI Agent浪潮在2012年才开始崛起","图灵测试→深蓝→深度学习→ChatGPT→Agent的演进"],"answer":"D"},{"no":205,"lesson":"第1课","stem":"简单事实查询（如“今天星期几”）最适合使用","options":["第一代传统搜索引擎","AI Agent","只能使用AI Ag 链接列表，由用户自行浏览","查询本地数据库并返回匹配记录"],"answer":"B"},{"no":304,"lesson":"实验1","stem":"关于三种信息获取方式的弊病，下列说法正确的是","options":["三种方式各有优势，输出基本不会偏差","只有大模型会出错，另两种都准确可靠","传统搜索需自行整合，AI搜索可能出错，大模型有幻觉","三者输出都可直接采信，无需核验"],"answer":"C"},{"no":305,"lesson":"实验1","stem":"关于“AI输出需核验”的理解，正确的是","options":["AI内容天然准确，可放心全部采信","AI可能出现与事实不符的幻觉，输出仍需人工核验","核验AI输出纯属浪费时间，不如直接采用","只有大模型需要核验，AI搜索与智能体无需检查"],"answer":"B"},{"no":306,"lesson":"实验1","stem":"通用AI大模型出现“幻觉”是指","options":["程序突然死机崩溃，系统无法运行","模型无法联网，不能调用外部信息","模型生成与事实不符、看似真实却错误的内容","模型拒绝回答所有提问"],"answer":"C"},{"no":307,"lesson":"实验2","stem":"监督学习图像分类中，我们给AI提供图片并告诉它每张图片属于哪一类，这称为","options":["模型，指最终用于预测的整套算法系统","准确率，指预测结果与答案吻合的程度","过拟合，指模型只记住训练图片的现象","标签，即告诉模型每张图片所属的类别"],"answer":"D"},{"no":308,"lesson":"实验2","stem":"预测概率代表的是","options":["图片像素尺寸大小，越大越清晰","图片分辨率高低，反映成像清晰度","图片属于各类的可能性，最高者即预测类别","图片拍摄时间，反映照片新旧"],"answer":"C"},{"no":309,"lesson":"实验2","stem":"对照实验“控制变量法”要求三组实验只改变什么","options":["只改变模型结构，用不同层数网络","只改变训练参数，如学习率、轮数、初始权重","只改变分类主题，识别不同种类物体","只改变训练数据量，每类用十、二十、三十张"],"answer":"D"},{"no":310,"lesson":"实验2","stem":"数据量少时（如10张/类）出现“训练集准确率很高但验证集/新图效果差”，这种现象称为","options":["欠拟合，模型连训练集都无法识别","收敛，模型训练趋于稳定","归一化，对像素数值做缩放处理","过拟合，模型背下训练图片而非学会规律"],"answer":"D"},{"no":311,"lesson":"实验2","stem":"准确率很低（低于60%）的可能原因不包括","options":["图片标注错误，标签与内容不符导致误学","两类图片过于相似，且每类样本数据量不足","图片质量差、画面模糊，特征难以提取","显示器分辨率，它并不影响模型判断"],"answer":"D"},{"no":312,"lesson":"实验3","stem":"计算机视觉是让计算机","options":["听懂语音，实现语音识别与转写","编写文字，自动生成文章与文档","进行数值计算，完成科学运算任务","看懂图像，理解画面中的内容"],"answer":"D"},{"no":313,"lesson":"实验3","stem":"一张图片在计算机中是一个","options":["数字矩阵，每个像素由若干数字表示","文本文件，存储为一串字符","音频文件，由波形采样数据构成","视频流，由连续动态帧序列组成"],"answer":"A"},{"no":314,"lesson":"实验3","stem":"AI通过多层神经网络逐步提取特征，其顺序是","options":["整体、特征、边缘，最后到像素","像素、边缘、特征，最后合成整体","特征、像素、整体，最后到边缘","边缘、像素、整体，最后到特征"],"answer":"B"},{"no":315,"lesson":"实验3","stem":"AI识图中层识别的是","options":["边缘与颜色，处理最原始的像素信息","做整体判断，直接给出整张图的类别","识别文字，将字符逐字提取出来","纹理与局部形状，如斑点和轮廓细节"],"answer":"D"},{"no":316,"lesson":"实验3","stem":"“判断整张图片是什么类别（这是猫）”属于计算机视觉的哪项任务","options":["框出物体位置并识别类别，称为目标检测","判断整张图属于什么类别，称为图像分类","精确勾勒物体像素轮廓，称为图像分割","提升画质或修复破损内容，称为图像增强修复"],"answer":"B"},{"no":317,"lesson":"实验3","stem":"“找到物体在哪里并判断是什么（用框标出这是猫在左边）”属于","options":["只判断整张图属于哪一类，称为图像分类","精确到像素勾勒轮廓，称为图像分割","框出物体位置并识别类别，称为目标检测","修复模糊去除多余物体，称为图像增强"],"answer":"C"},{"no":318,"lesson":"实验3","stem":"“精确到像素级别的边界划分（精确勾勒猫的轮廓）”属于","options":["只判断整张图属于哪一类，称为图像分类","框出物体位置并判断类别，称为目标检测","提升画质修复老照片，称为图像修复","精确到像素勾勒轮廓边界，称为图像分割"],"answer":"D"},{"no":319,"lesson":"实验3","stem":"“提升图片质量或修复内容（去模糊、老照片修复、去物体）”属于","options":["去模糊、修复老照片或移除多余物体，称为图像增强与修复","判断整张图属于哪一类，称为图像分类","框出物体位置并识别类别，称为目标检测","精确到像素勾勒轮廓，称为图像分割"],"answer":"A"},{"no":320,"lesson":"实验3","stem":"2026年的文生图工具已经非常逼真，但AI生成图片仍存在的常见破绽不包括","options":["人物细节出错，如手指数量异常、牙齿崩坏","生成画面完全真实可信，找不出破绽","光影不一致，阴影方向与光源矛盾","招牌文字乱码扭曲，出现无法辨认的符号"],"answer":"B"},{"no":321,"lesson":"实验3","stem":"防伪判断依据可以从哪些方面找","options":["只看文件大小，体积越大越真实","只看颜色，色彩鲜艳就真实","从人物细节、光影、文字、背景与物理规律判断","只看边框，边框规整就真实"],"answer":"C"},{"no":322,"lesson":"实验4","stem":"AI文本生成是大语言模型基于什么，按照概率预测接续生成文字","options":["基于海量学习数据，按概率预测接续生成文字","基于数据库查询，检索并返回预存答案","基于人工规则，逐条套用语法拼接文字","基于实时网页，联网抓取最新网页生成"],"answer":"A"},{"no":323,"lesson":"实验4","stem":"大模型并不真正“理解”语义，会出现什么","options":["仍能精确计算复杂数学算式","会产生幻觉，编造不存在的数据与文献","引用的文献都真实可靠可查证","推理逻辑完美无缺、前后不矛盾"],"answer":"B"},{"no":324,"lesson":"实验4","stem":"AI文本质量校验是指","options":["由AI自我检查，自动发现并改正潜在错误","电脑杀毒，扫描隐藏的病毒木马","人工核查AI输出，甄别事实错误、逻辑矛盾、空洞表述与幻觉编造","网络测速，检测带宽与页面加载速度"],"answer":"C"},{"no":325,"lesson":"实验4","stem":"结构化提示词遵循的四要素C-B-I-O是","options":["颜色、边框、图标与排版","内容、背景、输入与输出","角色、行为、输入与输出","角色、背景、指令与输出格式"],"answer":"D"},{"no":326,"lesson":"实验4","stem":"人工逐段核查生成文本时，需要重点排查的问题类型不包括","options":["事实错误，如编造数据、不存在的研究或错误时间","逻辑漏洞，如前后矛盾或推理不成立","空话套话、AI幻觉与表述不清等质量问题","字体大小设置，它不属于内容质量问题"],"answer":"D"},{"no":327,"lesson":"实验4","stem":"“编造引用、案例、统计数字”属于哪类问题","options":["AI幻觉","逻辑漏洞","空话套话","表述问题"],"answer":"A"},{"no":328,"lesson":"实验4","stem":"“输出内容是否贴合任务需求”对应五维度中的","options":["成稿各部分是否齐全、层次是否分明","行文是否具备具体细节而非空泛套话","文体语气是否与预期风格相符","成稿是否切题、内容是否贴合任务需求"],"answer":"D"},{"no":329,"lesson":"实验4","stem":"提示词对照实验应尽量选择什么难度的任务","options":["越简单越好，一两句话能完成的","难度随意，难易差别都能看出","专挑最难的任务，越难越能体现水平","复杂度中等以上，过简单短句难显差距"],"answer":"D"},{"no":330,"lesson":"实验4","stem":"设定角色提升专业度、补充背景信息让内容贴合场景、明确格式要求让结构清晰，这些属于","options":["工程上不可行，无法落地使用","可反复套用的提示词优化实用技巧","典型错误示范，会让输出更混乱","纯属浪费时间，对成稿无帮助"],"answer":"B"},{"no":331,"lesson":"实验5","stem":"全模态AIGC是基于什么分别生成图像、视频、语音、数字人等内容的","options":["依据预存数据库记录逐条调取现成素材","由画师人工手绘后再扫描输入电脑","依据用户输入的提示词文本分别生成各模态内容","对现成视频录像剪辑拼接后重新输出"],"answer":"C"},{"no":332,"lesson":"实验5","stem":"提示词描述的完整度、结构化程度直接决定","options":["运行时电脑的运算速度与画面帧率","生成时占用的网络带宽与传输速率","程序运行占用的内存容量上限","最终生成内容的质量与是否贴合创作设想"],"answer":"D"},{"no":333,"lesson":"实验5","stem":"全模态AIGC四大任务不包括","options":["人脸识别，它属于身份核验、不在四大创作之列","文生图，由文本提示词生成静态图片","文生视频，由文本描述生成动态短视频","AI语音合成与数字人播报"],"answer":"A"},{"no":334,"lesson":"实验5","stem":"撰写高质量提示词的六大核心要素是","options":["排版装饰，如颜色字体边框图标间距","画面构成，如主体场景光影风格画质构图","文稿写作，如字数篇幅格式排版字体","对话组织，如角色背景指令输出示例字数"],"answer":"B"},{"no":335,"lesson":"实验5","stem":"劣质简短提示词的特点和问题是","options":["描述十分详尽，对画面约束充分全面","输出完全可控，每处细节都能精确掌控","描述信息偏少，AI自由发挥空间大、输出随机性强","生成结果高度确定，每次重绘都一致"],"answer":"C"},{"no":336,"lesson":"实验5","stem":"结构化优质提示词包含多维度信息，作用是","options":["让AI有更大发挥余地，随意创作不受限","让输出更随机多变，每次结果差异明显","对生成过程实际上起不到作用","约束AI发挥，使结果更贴近创作者原始设想"],"answer":"D"},{"no":337,"lesson":"实验5","stem":"关于全模态AIGC各模态的成熟度，下列说法正确的是","options":["文生图相对成熟，画面效果较稳定可用","文生视频最成熟，人物动作细节无可挑剔","数字人最成熟，口型表情完全自然","各模态发展一致，成熟度无差别"],"answer":"A"},{"no":338,"lesson":"实验5","stem":"当前文生视频容易出现的问题是","options":["画面完美无瑕，没有任何可见缺陷","易出现物体变形、动作闪烁与细节崩坏","成品无缺陷，质量达实拍电影水准","画面与文生图完全相同，没有新问题"],"answer":"B"},{"no":339,"lesson":"实验5","stem":"AI语音、数字人虽能快速产出，但在什么方面仍存在缺陷","options":["生成速度仍明显偏慢，难以快速产出","画面画质仍较模糊，达不到高清","情感表达与口型精准匹配方面仍有明显缺陷","画面构图仍不合理，镜头缺乏美感"],"answer":"C"},{"no":340,"lesson":"实验5","stem":"使用AIGC内容时需要关注版权风险，所有AI生成内容应当","options":["直接标注为用户原创，享受完整著作权","无需标注，可当普通内容自由使用","从平台彻底删除，不得对外发布","主动标注为AI生成，履行版权与透明义务"],"answer":"D"},{"no":341,"lesson":"实验5","stem":"对比两张生成图片从哪六个维度分析","options":["响应速度、计费、字体颜色等外观角度","字数篇幅、段落排版、配色美观等版式角度","模型准确率、召回率、耗时与内存占用","主体场景光影风格画质构图等六方面"],"answer":"D"},{"no":342,"lesson":"实验5","stem":"关于“画面好看”与“符合创作预期”，正确的理解是","options":["劣质提示词也可能出美观图，但内容易偏离设想","画面好看与符合创作预期完全是同一回事","优质提示词的结果反而一定难看","劣质提示词生成的图一定难看"],"answer":"A"},{"no":343,"lesson":"实验5","stem":"文生视频提示词应尽量","options":["只写静态画面，动作细节不必交代","通篇不写动作，只交代场景与氛围","多写动态动作描述，减少细碎静态描述","只交代颜色，光影动作细节不必写入"],"answer":"C"},{"no":344,"lesson":"实验5","stem":"数字人相对真人的常见缺陷是","options":["生成速度比真人快，短时间产出成片","口型与语音错位、面部表情僵硬","面部表情生动自然，与真人几乎无差别","口型与语音精准同步，没有错位"],"answer":"B"},{"no":345,"lesson":"实验5","stem":"全模态AIGC优劣势总结从哪五个维度进行","options":["内容独特性、情感温度、产出效率、准确性与版权风险","响应速度、计费、字体颜色画面大小等运营角度","字数篇幅、段落排版、配色美观等版式角度","模型准确率、召回率、耗时成本与内存占用"],"answer":"A"},{"no":346,"lesson":"实验5","stem":"“AI能否产出真正原创创意”对应AIGC优劣势总结中的","options":["情感温度，即内容能否打动人","内容独特性，即能否产出原创创意","产出效率，即内容产出快不快","版权风险，即对外使用是否合规"],"answer":"B"},{"no":347,"lesson":"实验6","stem":"AI Agent与普通聊天AI的本质区别是","options":["聊天AI与AI Agent没有任何区别，只是叫法不同","聊天AI比Agent更能做事，能直接动手完成任务","AI Agent完全不会对话，只能默默执行指令","聊天AI只给文字建议，Agent能调用工具交付成果"],"answer":"D"},{"no":348,"lesson":"实验6","stem":"AI Agent（智能体）是能够自主理解目标、调用工具、执行多步操作并交付成果的智能系统，其核心特征是","options":["能实际打开应用、读取文件并生成可用文档成果","只能输出文字，无法对外部系统操作","不能调用外部工具，只能纯文本对话","只能单轮问答，无法连续多步任务"],"answer":"A"},{"no":349,"lesson":"实验6","stem":"Agent能力存在的层次差异是","options":["只有单一一种，不存在层次之分","由低到高分为纯对话、工具调用、桌面操作与垂直专用","只有纯对话与工具调用两个层次","边界模糊混乱，无法划分清晰层次"],"answer":"B"},{"no":350,"lesson":"实验6","stem":"建立用户档案（长期记忆）的作用是","options":["对AI作答实际上起不到作用","只在第一次任务保存一次，之后不再用","收集并定期删除用户个人信息","让AI结合用户专业课程与目标作答，更贴合需求"],"answer":"D"},{"no":351,"lesson":"实验6","stem":"技能（Skill）是指","options":["垂直领域里承担特定任务的专业角色身份","连接AI与外部应用的数据传输通道","把已验证方法沉淀为可复用手艺，同类任务直接调用","系统按周期自动触发的定时任务"],"answer":"C"},{"no":352,"lesson":"实验6","stem":"专家（Expert）是指","options":["已验证工作方法沉淀成的可复用手艺","连接AI与外部应用的数据传输通道","系统按固定周期自动触发的任务","某领域专业角色，如数据处理或全栈开发"],"answer":"D"},{"no":353,"lesson":"实验6","stem":"连接器（Connector）是指","options":["AI与外部应用间的通道，如问卷、文档、邮箱","承担特定任务的领域专业角色身份","成熟工作方法沉淀成的可复用手艺","保存用户长期背景信息的个人档案库"],"answer":"A"},{"no":354,"lesson":"实验6","stem":"项目（Project）容器是指","options":["电脑里普通存放文件的文件夹目录","记录用户长期偏好的个人档案","把相关任务规则资料打包的协作容器","连接AI与外部应用的数据通道"],"answer":"C"},{"no":355,"lesson":"实验7","stem":"AI大模型是基于什么训练而来","options":["由人工逐条编写的规则库与专家知识条目","在海量互联网公开语料数据上训练而成","依赖数据库中的结构化记录精确查询","通过现场采访和问卷调查采集一手资料"],"answer":"B"},{"no":356,"lesson":"实验7","stem":"训练数据中自带的社会刻板印象会被模型继承，表现为","options":["严格训练后输出完全不带偏见","偏见只以文本回答出现，不涉及图像","同时表现为文本偏见与文生图图像偏见","偏见只存在于文生图，文本回答完全中立"],"answer":"C"},{"no":357,"lesson":"实验7","stem":"AI文本偏见的表现是","options":["任何问题的回答都绝对中立客观","只出现在图像生成结果中，与文字无关","不携带任何固化认知，回答不带偏见","回答职业能力问题时输出固化的性别、身份、出身刻板认知"],"answer":"D"},{"no":358,"lesson":"实验7","stem":"AI图像偏见的表现是","options":["文生图生成职业人物时在性别、肤色、形象上出现固化画像","每张图片都完全客观中立，不带个人偏好","只体现在文字回答中，与画面无关","生成图像时不携带任何人物刻板印象"],"answer":"A"},{"no":359,"lesson":"实验7","stem":"公有AI服务在使用过程中会收集用户的","options":["扫描并上传硬盘里全部私人文件","收集用户输入的对话内容及主动上传的资料","对屏幕实时录像并回传服务器存档","记录账号密码以便后续自动登录"],"answer":"B"},{"no":360,"lesson":"实验7","stem":"部分产品会将用户对话数据用于","options":["删除违规用户账号并永久封禁","加密存储对话内容以防他人访问","用于后续版本的模型迭代训练以提升回答质量","自动判定并封禁被怀疑的用户"],"answer":"C"},{"no":361,"lesson":"实验7","stem":"隐私脱敏是指在保留原有业务含义的前提下","options":["移除、替换、模糊身份标识与涉密信息","把全部个人信息一律删干净再交给AI","对所有文字统一加密后再上传","只保留真实姓名，删除其余业务内容"],"answer":"A"},{"no":362,"lesson":"实验7","stem":"脱敏四步法包括","options":["删除、新增、修改与查询四类操作","删除标识、数值泛化、替换ID与保留业务信息","加密、解密、压缩与传输四个步骤","收集、清洗、标注、训练的标准流程"],"answer":"B"},{"no":363,"lesson":"实验7","stem":"单条输出不一定体现偏见，因此判断应","options":["综合多组提示词与多次生成结果整体判断","仅凭单条输出即可断定有无偏见","只看一次回答就下结论，无需重复实验","凭主观印象随意判断"],"answer":"A"},{"no":364,"lesson":"实验7","stem":"关于脱敏的意义，下列说法正确的是","options":["对文本安全无意义，纯属多余步骤","脱敏后文本可安全交给AI处理且保留业务含义","会破坏文本中一切信息使其无法使用","只是走形式，对数据安全无帮助"],"answer":"B"},{"no":365,"lesson":"实验7","stem":"若免费版本没有关闭“允许使用我的数据用于模型训练”的开关，代表","options":["用免费版对话就一定完全安全","开启开关后对话不会被用于任何用途","上传的对话会被自动删除不留记录","对话内容存在被用于模型训练的可能"],"answer":"D"},{"no":366,"lesson":"实验7","stem":"关于AI偏见，正确的认知是","options":["精心调参可把偏见完全消除","当前大模型输出已完全不带偏见","偏见难以完全消除，应学会辨别输出中的刻板印象","偏见无关紧要，使用时无需 for (var i = 0; i < QUESTIONS.length; i++) { QMAP[QUESTIONS[i].no] = QUESTIONS[i]; }

function lessonRank(l) {
  var m = /^第(\d+)课$/.exec(l); if (m) return [0, +m[1], l];
  m = /^实验(\d+)$/.exec(l);     if (m) return [1, +m[1], l];
  return [2, 0, l];
}
var LESSONS = (function () {
  var seen = {}, out = [];
  for (var i = 0; i < QUESTIONS.length; i++) {
    var l = QUESTIONS[i].lesson || "其他";
    if (!seen[l]) { seen[l] = 0; out.push(l); }
    seen[l]++;
  }
  out.sort(function (a, b) {
    var ra = lessonRank(a), rb = lessonRank(b);
    for (var k = 0; k < 3; k++) { if (ra[k] < rb[k]) return -1; if (ra[k] > rb[k]) return 1; }
    return 0;
  });
  return out.map(function (l) { return { name: l, count: seen[l] }; });
})();

var storageOK = true;
function fresh() {
  return { answered: {}, wrong: {}, fav: {}, seq: 0, exam: [], set: { autoNext: false, recite: false } };
}
function loadState() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return fresh();
    var s = JSON.parse(raw);
    var f = fresh();
    s.answered = s.answered || {}; s.wrong = s.wrong || {}; s.fav = s.fav || {};
    s.exam = s.exam || []; s.seq = s.seq || 0;
    s.set = s.set || {}; s.set.autoNext = !!s.set.autoNext; s.set.recite = !!s.set.recite;
    return s;
  } catch (e) { storageOK = false; return fresh(); }
}
var state = loadState();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { storageOK = false; }
}
function resetAll() {
  state = fresh(); save();
}

/* ==================== 工具 ==================== */
function esc(s) {
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function ltr(i) { return "ABCD"[i]; }
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function keysOf(obj) { return Object.keys(obj).map(Number).filter(function (n) { return !!QMAP[n]; }); }
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function fmtDur(ms) {
  var s = Math.max(0, Math.round(ms / 1000));
  var m = Math.floor(s / 60); s = s % 60;
  return m + "分" + (s < 10 ? "0" : "") + s + "秒";
}
function fmtClock(ms) {
  var s = Math.max(0, Math.round(ms / 1000));
  var m = Math.floor(s / 60); s = s % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function today() {
  var d = new Date();
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
}
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "show";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ""; }, 1500);
}
function stats() {
  var done = 0, right = 0;
  for (var k in state.answered) { if (state.answered.hasOwnProperty(k)) { done++; if (state.answered[k].ok) right++; } }
  return {
    done: done, right: right, total: QUESTIONS.length,
    acc: pct(right, done),
    wrong: keysOf(state.wrong).length,
    fav: keysOf(state.fav).length,
    cover: pct(done, QUESTIONS.length)
  };
}
function lessonStat(name) {
  var done = 0, right = 0, cnt = 0;
  for (var i = 0; i < QUESTIONS.length; i++) {
    var q = QUESTIONS[i];
    if ((q.lesson || "其他") !== name) continue;
    cnt++;
    var a = state.answered[q.no];
    if (a) { done++; if (a.ok) right++; }
  }
  return { cnt: cnt, done: done, right: right, acc: pct(right, done) };
}

/* ==================== 会话 ==================== */
var view = "home";
var S = null;          /* 当前练习/考试会话 */
var timerId = null;

function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

function startPractice(mode, title, list) {
  if (!list.length) { toast("这里还没有题目"); return; }
  S = { mode: mode, title: title, list: list, idx: 0, revealed: {}, picks: {}, start: Date.now() };
  view = "practice";
  window.scrollTo(0, 0);
  render();
}
function resumeSeq() {
  var list = QUESTIONS.map(function (q) { return q.no; });
  startPractice("seq", "顺序练习", list);
  var pos = Math.max(0, Math.min(state.seq || 0, list.length - 1));
  S.idx = pos;
  render();
}
function startExam(total, minutes, onlyWrong) {
  var pool = onlyWrong ? keysOf(state.wrong) : QUESTIONS.map(function (q) { return q.no; });
  if (pool.length < 4) { toast("题量不足，无法组卷"); return; }
  var picked = shuffle(pool.slice()).slice(0, Math.min(total, pool.length));
  S = {
    mode: "exam", title: "模拟考试", list: picked, idx: 0, revealed: {}, picks: {},
    start: Date.now(), limit: minutes * 60000, deadline: minutes > 0 ? Date.now() + minutes * 60000 : 0, sheet: false
  };
  view = "exam";
  window.scrollTo(0, 0);
  render();
  if (minutes > 0) startTimer();
}
function startTimer() {
  stopTimer();
  timerId = setInterval(function () {
    if (view !== "exam" || !S || !S.deadline) { stopTimer(); return; }
    var left = S.deadline - Date.now();
    var c = document.getElementById("clock");
    if (left <= 0) { stopTimer(); toast("时间到，自动交卷"); submitExam(true); return; }
    if (c) {
      c.textContent = "剩余 " + fmtClock(left);
      c.className = "clock" + (left < 60000 ? " danger" : "");
    }
  }, 500);
}

/* ==================== 答题 ==================== */
function currentQ() { return S && S.list.length ? QMAP[S.list[S.idx]] : null; }

function pick(i) {
  var q = currentQ(); if (!q) return;
  var key = q.no;
  if (S.mode === "exam") {
    S.picks[key] = i;
    render();
    return;
  }
  if (S.revealed[key] !== undefined) return;
  S.revealed[key] = i;
  var ok = ltr(i) === q.answer;
  state.answered[key] = { p: i, ok: ok, t: Date.now() };
  var fixed = false;
  if (ok) { if (state.wrong[key]) { delete state.wrong[key]; fixed = true; } }
  else { state.wrong[key] = 1; }
  if (S.mode === "seq") state.seq = S.idx;
  save();
  render();
  if (fixed) toast("答对了，已移出错题本");
  if (state.set.autoNext && S.idx < S.list.length - 1) {
    setTimeout(function () { if (view === "practice") nextQ(); }, ok ? 520 : 1200);
  }
}
function nextQ() {
  if (!S) return;
  if (S.idx >= S.list.length - 1) {
    if (S.mode === "exam") { toast("已经是最后一题，可以交卷了"); return; }
    view = "done"; window.scrollTo(0, 0); render(); return;
  }
  S.idx++;
  if (S.mode === "seq") { state.seq = S.idx; save(); }
  window.scrollTo(0, 0); render();
}
function prevQ() {
  if (!S) return;
  if (S.idx <= 0) { toast("已经是第一题"); return; }
  S.idx--;
  if (S.mode === "seq") { state.seq = S.idx; save(); }
  window.scrollTo(0, 0); render();
}
function jumpTo(i) {
  if (!S || i < 0 || i >= S.list.length) return;
  S.idx = i;
  if (S.mode === "seq") { state.seq = i; save(); }
  window.scrollTo(0, 0); render();
}
function toggleFav() {
  var q = currentQ(); if (!q) return;
  if (state.fav[q.no]) { delete state.fav[q.no]; toast("已取消收藏"); }
  else { state.fav[q.no] = 1; toast("已收藏"); }
  save(); render();
}
function submitExam(auto) {
  stopTimer();
  var right = 0, list = S.list, detail = [];
  for (var i = 0; i < list.length; i++) {
    var q = QMAP[list[i]];
    var p = S.picks[list[i]];
    var ok = (p !== undefined && ltr(p) === q.answer);
    if (ok) right++;
    else state.wrong[list[i]] = 1;
    detail.push({ no: q.no, picked: p, ok: ok });
  }
  var score = Math.round(right / list.length * 100);
  var rec = {
    t: Date.now(), total: list.length, right: right, score: score,
    used: Date.now() - S.start, auto: !!auto,
    wrong: detail.filter(function (d) { return !d.ok; }).map(function (d) { return d.no; })
  };
  state.exam.unshift(rec);
  if (state.exam.length > 30) state.exam.length = 30;
  save();
  S.detail = detail; S.result = rec;
  view = "result";
  window.scrollTo(0, 0);
  render();
}

/* ==================== 渲染 ==================== */
var app = document.getElementById("app");
var topbar = document.getElementById("topbar");
var tabs = document.getElementById("tabs");

var TABS = [
  { id: "home", ic: "🏠", label: "首页" },
  { id: "wrong", ic: "❌", label: "错题本" },
  { id: "fav", ic: "⭐", label: "收藏" },
  { id: "stats", ic: "📊", label: "统计" },
  { id: "ops", ic: "📝", label: "操作题" }
];
function renderTabs() {
  var cur = view;
  if (cur === "practice" || cur === "exam" || cur === "done" || cur === "result" || cur === "lessons") cur = "home";
  tabs.innerHTML = TABS.map(function (t) {
    var n = 0;
    if (t.id === "wrong") n = keysOf(state.wrong).length;
    if (t.id === "fav") n = keysOf(state.fav).length;
    var badge = n ? '<span style="font-size:10px">(' + n + ')</span>' : "";
    return '<button data-tab="' + t.id + '" class="' + (cur === t.id ? "on" : "") + '">' +
      '<span class="ic">' + t.ic + '</span><span>' + t.label + badge + '</span></button>';
  }).join("");
}
function setTop(opts) {
  if (!opts) { topbar.style.display = "none"; topbar.innerHTML = ""; return; }
  topbar.style.display = "";
  topbar.innerHTML = '<div class="inner">' +
    (opts.back ? '<button class="tb-back" data-act="back">‹</button>' : '') +
    '<div class="tb-title">' + esc(opts.title) + '</div>' +
    '<div class="tb-meta">' + (opts.meta || "") + '</div>' +
    '</div>';
}

function render() {
  renderTabs();
  if (view === "home") renderHome();
  else if (view === "lessons") renderLessons();
  else if (view === "practice") renderPractice();
  else if (view === "done") renderDone();
  else if (view === "examsetup") renderExamSetup();
  else if (view === "exam") renderExam();
  else if (view === "result") renderResult();
  else if (view === "wrong" || view === "fav") renderList(view);
  else if (view === "stats") renderStats();
  else if (view === "ops") renderOps();
  else if (view === "search") renderSearch();
}

/* ---------- 分类 ---------- */
function renderLessons() {
  setTop({ back: true, title: "分类练习", meta: QUESTIONS.length + " 题" });
  var html = '<div class="sec-title">按课次 / 实验</div>';
  for (var i = 0; i < LESSONS.length; i++) {
    var L = LESSONS[i], s = lessonStat(L.name);
    var w = pct(s.done, s.cnt);
    html += '<button class="mode" data-act="lesson" data-name="' + esc(L.name) + '" style="margin-bottom:8px">' +
      '<b>' + esc(L.name) + '<span class="pill">' + s.cnt + ' 题</span></b>' +
      '<span>已做 ' + s.done + '/' + s.cnt + '　正确率 ' + (s.done ? s.acc + "%" : "—") + '</span>' +
      '<div class="pbar" style="margin-top:8px"><i style="width:' + w + '%"></i></div></button>';
  }
  app.innerHTML = html;
}

/* ---------- 题干选项渲染 ---------- */
function optsHtml(q, picked, showAns) {
  var out = "";
  for (var i = 0; i < q.options.length; i++) {
    var cls = "opt";
    if (showAns) {
      if (ltr(i) === q.answer) cls += " ok";
      else if (i === picked) cls += " bad";
      else cls += " dim";
    } else if (picked === i) cls += " picked";
    out += '<button class="' + cls + '" data-act="pick" data-i="' + i + '">' +
      '<span class="k">' + ltr(i) + '</span><span class="t">' + esc(q.options[i]) + '</span></button>';
  }
  return '<div class="opts">' + out + '</div>';
}

/* ---------- 练习 ---------- */
function renderPractice() {
  if (!S || !S.list.length) { view = "home"; render(); return; }
  var q = currentQ();
  var picked = S.revealed[q.no];
  var answered = picked !== undefined;
  var showAns = answered || state.set.recite;
  var ok = answered && ltr(picked) === q.answer;

  setTop({
    back: true, title: S.title,
    meta: (S.idx + 1) + " / " + S.list.length
  });

  var html = '<div class="pbar" style="margin:10px 0 0"><i style="width:' + pct(S.idx + 1, S.list.length) + '%"></i></div>';
  html += '<div class="qcard">' +
    '<span class="tag">' + esc(q.lesson || "其他") + '</span><span class="tag gray">第 ' + q.no + ' 题</span>' +
    '<div class="stem">' + esc(q.stem) + '</div>' +
    optsHtml(q, picked, showAns) +
    (showAns ? '<div class="ansline">' +
      '<span class="good">正确答案：' + q.answer + '</span>' +
      (answered ? (ok ? '<span class="good">✓ 你答对了</span>' : '<span class="wrong">✗ 你选了 ' + ltr(picked) + '</span>') : '<span class="muted small">背题模式</span>') +
      '</div>' : '') +
    '</div>';

  html += '<div class="navbtns">' +
    '<button data-act="prev"' + (S.idx === 0 ? " disabled" : "") + '>上一题</button>' +
    '<button class="fav" data-act="fav">' + (state.fav[q.no] ? "★" : "☆") + '</button>' +
    '<button class="primary" data-act="next">' + (S.idx === S.list.length - 1 ? "完成" : "下一题") + '</button>' +
    '</div>';

  var doneN = 0, rightN = 0;
  for (var k in S.revealed) {
    if (!S.revealed.hasOwnProperty(k)) continue;
    doneN++;
    var qq = QMAP[k];
    if (qq && ltr(S.revealed[k]) === qq.answer) rightN++;
  }
  html += '<div class="small muted" style="text-align:center">本组已答 ' + doneN + ' 题 · 正确率 ' + (doneN ? pct(rightN, doneN) + "%" : "—") + '</div>';

  app.innerHTML = html;
}

function renderDone() {
  setTop({ back: true, title: "本组完成" });
  var n = 0, r = 0;
  for (var k in S.revealed) {
    if (!S.revealed.hasOwnProperty(k)) continue;
    n++;
    var q = QMAP[k];
    if (q && ltr(S.revealed[k]) === q.answer) r++;
  }
  var wrongList = [];
  for (var kk in S.revealed) {
    if (!S.revealed.hasOwnProperty(kk)) continue;
    var qq = QMAP[kk];
    if (qq && ltr(S.revealed[kk]) !== qq.answer) wrongList.push(+kk);
  }
  app.innerHTML = '<div class="card" style="text-align:center;padding:24px 16px">' +
    '<div style="font-size:40px">' + (n && r / n >= 0.9 ? "🎉" : n && r / n >= 0.7 ? "👍" : "💪") + '</div>' +
    '<h2 style="margin:8px 0 2px">' + esc(S.title) + ' 完成</h2>' +
    '<div class="muted small">共 ' + n + ' 题　答对 ' + r + ' 题　正确率 <b style="color:var(--pri);font-size:16px">' + (n ? pct(r, n) : 0) + '%</b>　用时 ' + fmtDur(Date.now() - S.start) + '</div>' +
    '</div>' +
    '<div class="navbtns">' +
    (wrongList.length ? '<button class="primary" data-act="redo-wrong">只重做这 ' + wrongList.length + ' 道错题</button>' : "") +
    '<button data-act="back">返回首页</button></div>';
  S._wrongList = wrongList;
}

/* ---------- 错题本 / 收藏 ---------- */
function renderList(kind) {
  var list = keysOf(kind === "wrong" ? state.wrong : state.fav).sort(function (a, b) { return a - b; });
  var title = kind === "wrong" ? "错题本" : "收藏夹";
  setTop({ back: true, title: title, meta: list.length + " 题" });

    app.innerHTML = '<div class="empty">' + (kind === "wrong" ? "还没有错题 —— 保持住！" : "还没有收藏的题目") + '</div>';
    return;
  }
  var html = '<div class="navbtns" style="margin-top:12px">' +
    '<button class="primary" data-act="start-list" data-kind="' + kind + '">开始练习这 ' + list.length + ' 题</button>' +
    (kind === "wrong" ? '<button data-act="clear-wrong">清空</button>' : '<button data-act="clear-fav">清空</button>') +
    '</div>';
  html += '<div class="card" style="padding:10px 14px">';
  for (var i = 0; i < list.length; i++) {
    var q = QMAP[list[i]];
    var a = state.answered[q.no];
    html += '<div class="row" style="align-items:flex-start">' +
      '<div style="flex:1"><div class="small" style="font-weight:600">' + list[i] + '. ' + esc(q.stem) + '</div>' +
      '<div class="small muted">' + esc(q.lesson) + ' · 正确答案 ' + q.answer + (a ? ' · 你上次选 ' + ltr(a.p) : '') + '</div></div>' +
      '<button data-act="open-one" data-no="' + list[i] + '" data-kind="' + kind + '" style="color:var(--pri);font-weight:700;font-size:13px;white-space:nowrap">查看</button>' +
      '</div>';
  }
  html += '</div>';
  app.innerHTML = html;
}

    '<button class="mode ex-t on" data-t="0"><b>不限时</b></button>' +
    '<button class="mode ex-t" data-t="10"><b>10 分钟</b></button>' +
    '<button class="mode ex-t" data-t="20"><b>20 分钟</b></button>' +
    '<button class="mode ex-t" data-t="30"><b>30 分钟</b></button>' +
    '</div>' +
    '<div class="row" style="margin-top:6px"><div><b>只考错题</b><div class="small muted">从错题本的 ' + wrongN + ' 题里抽</div></div>' +
    '<button data-act="tog-onlywrong" style="border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700">已关闭</button></div>' +
    '<div class="navbtns" style="margin-bottom:0"><button class="primary" data-act="exam-go">开始考试</button></div>' +
    '<div class="small muted" style="margin-top:8px">及格线按 60 分计。交卷后会自动把错题收进错题本。</div>' +
    '</div>';
  S = S || {};
  S._n = 20; S._t = 0; S._onlyWrong = false;
}
function renderExam() {
  var q = currentQ();
  var picked = S.picks[q.no];
  var answeredN = 0;
  for (var i = 0; i < S.list.length; i++) { if (S.picks[S.list[i]] !== undefined) answeredN++; }
  var left = S.deadline ? S.deadline - Date.now() : 0;
  setTop({
    back: false, title: "模拟考试",
    meta: '<span id="clock" class="' + (S.deadline && left < 60000 ? "clock danger" : "clock") + '">' +
      (S.deadline ? "剩余 " + fmtClock(left) : "不限时") + '</span>'
  });
  var html = '<div class="pbar" style="margin:10px 0 0"><i style="width:' + pct(answeredN, S.list.length) + '%"></i></div>';
  html += '<div class="small muted" style="margin-top:6px">已答 ' + answeredN + ' / ' + S.list.length + '　第 ' + (S.idx + 1) + ' 题</div>';
  html += '<div class="qcard">' +
    '<span class="tag">第 ' + q.no + ' 题</span><span class="tag gray">' + esc(q.lesson) + '</span>' +
    '<div class="stem">' + esc(q.stem) + '</div>' +
    optsHtml(q, picked, false) +
    '</div>';
  html += '<div class="navbtns">' +
    '<button data-act="prev"' + (S.idx === 0 ? " disabled" : "") + '>上一题</button>' +
    '<button class="fav" data-act="toggle-sheet" title="答题卡">▦</button>' +
    '<button data-act="next">' + (S.idx === S.list.length - 1 ? "最后一题" : "下一题") + '</button>' +
    '</div>';
  html += '<div class="navbtns"><button class="primary" data-act="submit-exam">交卷（已答 ' + answeredN + ' 题）</button></div>';
  if (S.sheet) {
    html += '<div class="card"><div class="small" style="font-weight:700;margin-bottom:6px">答题卡</div><div class="sheet">';
    for (var j = 0; j < S.list.length; j++) {
      var cls = S.picks[S.list[j]] !== undefined ? "done" : "";
      if (j === S.idx) cls = "cur";
      html += '<button class="' + cls + '" data-act="jump" data-i="' + j + '">' + (j + 1) + '</button>';
    }
    html += '</div></div>';
  }
  app.innerHTML = html;
}
function renderResult() {
  var r = S.result;
  var pass = r.score >= 60;
  setTop({ back: true, title: "考试结果" });
  var html = '<div class="card" style="text-align:center;padding:22px 16px">' +
    '<div style="font-size:44px;font-weight:800;color:' + (pass ? "var(--ok)" : "var(--bad)") + '">' + r.score + '</div>' +
    '<div class="muted small">' + (pass ? "及格 ✅" : "不及格 ❌（按 60 分线）") + '　用时 ' + fmtDur(r.used) + (r.auto ? "（超时自动交卷）" : "") + '</div>' +
    '<div class="kpi" style="margin-top:14px">' +
      '<div><b>' + r.total + '</b><span>总题数</span></div>' +
      '<div><b style="color:var(--ok)">' + r.right + '</b><span>答对</span></div>' +
      '<div><b style="color:var(--bad)">' + (r.total - r.right) + '</b><span>答错</span></div>' +
      '<div><b>' + r.score + '%</b><span>得分率</span></div>' +
    '</div></div>';
  if (r.wrong.length) {
    html += '<div class="navbtns"><button class="primary" data-act="exam-redo-wrong">重做这 ' + r.wrong.length + ' 道错题</button><button data-act="back">返回首页</button></div>';
    html += '<div class="sec-title">错题回顾（点击可收藏）</div><div class="card" style="padding:10px 14px">';
    for (var i = 0; i < r.wrong.length; i++) {
      var q = QMAP[r.wrong[i]];
      var p = S.picks[q.no];
      html += '<div class="row" style="align-items:flex-start">' +
        '<div style="flex:1"><div class="small" style="font-weight:600">' + q.no + '. ' + esc(q.stem) + '</div>' +
        '<div class="small"><span class="wrong">你选 ' + (p === undefined ? "未答" : ltr(p)) + '</span>　<span class="good">正确 ' + q.answer + '</span>　<span class="muted">' + esc(q.options["ABCD".indexOf(q.answer)]) + '</span></div>' +
        '</div>' +
        '<button data-act="fav-no" data-no="' + q.no + '" style="color:var(--pri);font-weight:700;font-size:13px;white-space:nowrap">' + (state.fav[q.no] ? "★" : "☆") + '</button>' +
        '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="navbtns"><button class="primary" data-act="back">满分！返回首页</button></div>';
  }
  app.innerHTML = html;
}

/* ---------- 统计 ---------- */
function renderStats() {
  setTop(null);
  var st = stats();
  var html = '<div class="card"><div class="kpi">' +
    '<div><b>' + st.done + '</b><span>已做</span></div>' +
    '<div><b>' + st.acc + '%</b><span>正确率</span></div>' +
    '<div><b>' + st.wrong + '</b><span>错题</span></div>' +
    '<div><b>' + st.cover + '%</b><span>覆盖率</span></div>' +
    '</div><div class="pbar" style="margin-top:12px"><i style="width:' + st.cover + '%"></i></div>' +
    '<div class="small muted" style="margin-top:6px">已做 ' + st.done + ' / ' + st.total + ' 题，做对 ' + st.right + ' 题</div></div>';

  html += '<div class="sec-title">各课次掌握情况（正确率低的优先复习）</div><div class="card">';
  var rows = LESSONS.map(function (L) { var s = lessonStat(L.name); return { name: L.name, s: s }; });
  rows.sort(function (a, b) {
    if (a.s.done === 0 && b.s.done !== 0) return 1;
    if (b.s.done === 0 && a.s.done !== 0) return -1;
    return a.s.acc - b.s.acc;
  });
  for (var i = 0; i < rows.length; i++) {
    var s = rows[i].s;
    var cls = s.done === 0 ? "" : (s.acc < 60 ? "low" : s.acc < 85 ? "mid" : "");
    html += '<div class="bar"><div class="name">' + esc(rows[i].name) + '</div>' +
      '<div class="track"><i class="' + cls + '" style="width:' + pct(s.done, s.cnt) + '%"></i></div>' +
      '<div class="val">' + (s.done ? s.acc + "% · " + s.done + "/" + s.cnt : "未做") + '</div></div>';
  }
  html += '</div>';

  html += '<div class="sec-title">模拟考试记录（最近 10 次）</div><div class="card">';
  if (!state.exam.length) html += '<div class="small muted">还没有考试记录</div>';
  else {
    html += '<table class="hist"><tr><th>时间</th><th>题量</th><th>答对</th><th>得分</th></tr>';
    for (var k = 0; k < Math.min(10, state.exam.length); k++) {
      var e = state.exam[k];
      var d = new Date(e.t);
      html += '<tr><td>' + (d.getMonth() + 1) + "/" + d.getDate() + " " + (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes() +
        '</td><td>' + e.total + '</td><td>' + e.right + '</td><td style="font-weight:700;color:' + (e.score >= 60 ? "var(--ok)" : "var(--bad)") + '">' + e.score + '</td></tr>';
    }
    html += '</table>';
  }
  html += '</div>';

  html += '<div class="navbtns"><button data-act="export">导出错题（文本）</button><button data-act="reset">清空全部记录</button></div>';
  html += '<div class="small muted" style="text-align:center;margin-bottom:10px">进度保存在这台设备的浏览器里，换浏览器或清理数据会丢失。</div>';
  app.innerHTML = html;
}

/* ---------- 操作题 ---------- */
function renderOps() {
  setTop(null);
  var html = '<div class="card"><b>操作题部分（WPS 文字 / 表格 / 演示 + Windows 基本操作）</b>' +
    '<div class="small muted" style="margin-top:6px">这些是手工操作题，刷题网页没法自动判分。建议：在电脑上打开素材文件夹，照着「样张」图片一项一项做，做完对照样张检查。<br>' +
    '素材位置：压缩包 <b>2026免修考试复习题.zip</b> 里的「操作题」文件夹（考试时这些素材相当于 <b>C:\\KS</b> 文件夹）。</div></div>';
  html += '<div class="card ops">';
  for (var i = 0; i < OPS.length; i++) {
    html += '<h3>' + esc(OPS[i].title) + '</h3><ol>';
    for (var j = 0; j < OPS[i].items.length; j++) {
      html += '<li>' + esc(OPS[i].items[j]) + '</li>';
    }
    html += '</ol>';
  }
  html += '</div>';
  app.innerHTML = html;
}

/* ---------- 搜索 ---------- */
function renderSearch() {
  setTop({ back: true, title: "搜索结果", meta: (S && S.list ? S.list.length : 0) + " 题" });
  var list = S.list;
  if (!list.length) { app.innerHTML = '<div class="empty">没有找到相关题目</div>'; return; }
  var html = '<div class="card" style="padding:10px 14px">';
  for (var i = 0; i < list.length; i++) {
    var q = QMAP[list[i]];
    html += '<div class="row" style="align-items:flex-start">' +
      '<div style="flex:1"><div class="small" style="font-weight:600">' + q.no + '. ' + esc(q.stem) + '</div>' +
      '<div class="small muted">' + esc(q.lesson) + ' · 正确答案 ' + q.answer + '</div></div>' +
      '<button data-act="open-one" data-no="' + q.no + '" style="color:var(--pri);font-weight:700;font-size:13px;white-space:nowrap">查看</button>' +
      '</div>';
  }
  html += '</div>';
  app.innerHTML = html;
}

/* ==================== 事件 ==================== */
document.addEventListener("click", function (ev) {
  var t = ev.target.closest ? ev.target.closest("[data-act],[data-tab],[data-n],[data-t]") : null;
  if (!t) return;

  if (t.hasAttribute("data-tab")) {
    var id = t.getAttribute("data-tab");
    if (id === "home") { view = "home"; }
    else { view = id; }
    window.scrollTo(0, 0); render(); return;
  }
  if (t.hasAttribute("data-n") && t.classList.contains("ex-n")) {
    S = S || {}; S._n = +t.getAttribute("data-n");
    var ns = app.querySelectorAll(".ex-n");
    for (var i = 0; i < ns.length; i++) ns[i].classList.remove("on");
    t.classList.add("on"); return;
  }
  if (t.hasAttribute("data-t") && t.classList.contains("ex-t")) {
    S = S || {}; S._t = +t.getAttribute("data-t");
    var ts = app.querySelectorAll(".ex-t");
    for (var j = 0; j < ts.length; j++) ts[j].classList.remove("on");
    t.classList.add("on"); return;
  }

  var act = t.getAttribute("data-act");
  if (!act) return;

  if (act === "back") {
    stopTimer();
    if (view === "practice" || view === "done" || view === "exam" || view === "result") { view = "home"; }
    else if (view === "lessons" || view === "examsetup" || view === "search") { view = "home"; }
    window.scrollTo(0, 0); render(); return;
  }
  if (act === "seq") { resumeSeq(); return; }
  if (act === "random") { startPractice("random", "随机练习", shuffle(QUESTIONS.map(function (q) { return q.no; }))); return; }
  if (act === "lessons") { view = "lessons"; window.scrollTo(0, 0); render(); return; }
  if (act === "lesson") {
    var name = t.getAttribute("data-name");
    var list = QUESTIONS.filter(function (q) { return (q.lesson || "其他") === name; }).map(function (q) { return q.no; });
    startPractice("lesson", name, list); return;
  }
  if (act === "examsetup") { S = {}; view = "examsetup"; window.scrollTo(0, 0); render(); return; }
  if (act === "tog-onlywrong") {
    S = S || {}; S._onlyWrong = !S._onlyWrong;
    t.textContent = S._onlyWrong ? "已开启" : "已关闭";
    if (S._onlyWrong) { t.style.background = "var(--pri)"; t.style.color = "#fff"; t.style.borderColor = "var(--pri)"; }
    else { t.style.background = ""; t.style.color = ""; t.style.borderColor = "var(--line)"; }
    return;
  }
  if (act === "exam-go") {
    startExam(S._n || 20, S._t || 0, !!S._onlyWrong); return;
  }
  if (act === "tog-recite") { state.set.recite = !state.set.recite; save(); render(); return; }
  if (act === "tog-auto") { state.set.autoNext = !state.set.autoNext; save(); render(); return; }
  if (act === "pick") { pick(+t.getAttribute("data-i")); return; }
  if (act === "prev") { prevQ(); return; }
  if (act === "next") { nextQ(); return; }
  if (act === "jump") { jumpTo(+t.getAttribute("data-i")); return; }
  if (act === "toggle-sheet") { S.sheet = !S.sheet; render(); return; }
  if (act === "fav") { toggleFav(); return; }
  if (act === "fav-no") {
    var no = +t.getAttribute("data-no");
    if (state.fav[no]) { delete state.fav[no]; toast("已取消收藏"); }
    else { state.fav[no] = 1; toast("已收藏"); }
    save(); render(); return;
  }
  if (act === "submit-exam") {
    var left = S.list.length;
    var un = 0;
    for (var k = 0; k < left; k++) { if (S.picks[S.list[k]] === undefined) un++; }
    if (un > 0 && !confirm("还有 " + un + " 题没答，确定交卷吗？")) return;
    submitExam(false); return;
  }
  if (act === "exam-redo-wrong") {
    var wl = S.result.wrong.slice();
    startPractice("random", "重做错题", wl); return;
  }
  if (act === "start-list") {
    var kind = t.getAttribute("data-kind");
    var ls = keysOf(kind === "wrong" ? state.wrong : state.fav).sort(function (a, b) { return a - b; });
    startPractice(kind, kind === "wrong" ? "错题练习" : "收藏练习", ls); return;
  }
  if (act === "open-one") {
    var on = +t.getAttribute("data-no");
    var kd = t.getAttribute("data-kind") || "mine";
    startPractice(kd, "第 " + on + " 题", [on]); return;
  }
  if (act === "clear-wrong") { if (confirm("确定清空错题本？")) { state.wrong = {}; save(); render(); } return; }
  if (act === "clear-fav") { if (confirm("确定清空收藏夹？")) { state.fav = {}; save(); render(); } return; }
  if (act === "redo-wrong") { startPractice("random", "重做错题", (S._wrongList || []).slice()); return; }
  if (act === "do-search") {
    var box = document.getElementById("sq");
    doSearch(box ? box.value : ""); return;
  }
  if (act === "export") {
    var lines = ["《计算机与人工智能基础》免修考试 · 错题清单", "导出时间：" + new Date().toLocaleString(), ""];
    var ws = keysOf(state.wrong).sort(function (a, b) { return a - b; });
    if (!ws.length) lines.push("（暂无错题）");
    for (var i2 = 0; i2 < ws.length; i2++) {
      var q2 = QMAP[ws[i2]];
      var a2 = state.answered[q2.no];
      lines.push(q2.no + ". [" + q2.lesson + "] " + q2.stem);
      for (var o = 0; o < q2.options.length; o++) lines.push("   " + ltr(o) + ". " + q2.options[o]);
      lines.push("   正确答案：" + q2.answer + (a2 ? "（你选了 " + ltr(a2.p) + "）" : ""));
      lines.push("");
    }
    var blob = new Blob([lines.join("\r\n")], { type: "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "计算机免修-错题清单.txt";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("已导出"); return;
  }
  if (act === "reset") {
    if (confirm("确定清空全部做题记录（错题、收藏、进度、考试记录）？此操作不可撤销。")) {
      resetAll(); toast("已清空"); render();
    }
    return;
  }
});

function doSearch(kw) {
  kw = String(kw || "").trim();
  if (!kw) { toast("请输入关键词"); return; }
  var kwl = kw.toLowerCase();
  var list = QUESTIONS.filter(function (q) {
    if (q.stem.toLowerCase().indexOf(kwl) >= 0) return true;
    for (var i = 0; i < q.options.length; i++) { if (q.options[i].toLowerCase().indexOf(kwl) >= 0) return true; }
    return false;
  }).map(function (q) { return q.no; });
  S = { list: list, idx: 0 };
  view = "search";
  window.scrollTo(0, 0); render();
  if (!list.length) toast("没有找到相关题目");
}

document.addEventListener("keydown", function (ev) {
  if (view !== "practice" && view !== "exam") return;
  var tag = (ev.target && ev.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  var k = ev.key.toUpperCase();
  if (k === "A" || k === "B" || k === "C" || k === "D") { pick("ABCD".indexOf(k)); ev.preventDefault(); return; }
  if (k === "ARROWRIGHT") { nextQ(); ev.preventDefault(); return; }
  if (k === "ARROWLEFT") { prevQ(); ev.preventDefault(); return; }
  if (k === "F" && view === "practice") { toggleFav(); ev.preventDefault(); return; }
  if (k === "ENTER" || k === " ") { nextQ(); ev.preventDefault(); }
});

document.addEventListener("keydown", function (ev) {
  if (ev.key === "Enter" && view === "home" && ev.target && ev.target.id === "sq") { doSearch(ev.target.value); }
});

/* ==================== 启动 ==================== */
render();
</script>
</body>
</html>
